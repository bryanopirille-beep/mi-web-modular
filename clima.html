<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clima</title>
</head>
<body>
    <h1>Buscador de clima</h1>
    <input type="text" id="inputCiudad" placeholder= "San ignacio Mns">
    <button onclick="buscarClima()">Buscar</button>
    <div id="resultado"></div>
    <script>
        function buscarClima() {
            const ciudad = document.getElementById("inputCiudad").value;
           fetch("https://geocoding-api.open-meteo.com/v1/search?name=" + ciudad)
           .then(function (respuesta) {
            return respuesta.json();
           })
           .then(function(datos) {
             const lat = datos.results[0].latitude;
             const lon = datos.results[0].longitude;
             fetch("https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon + "&current_weather=true")
  .then(function (respuesta2) {
    return respuesta2.json();
  })
  .then(function (clima) {
    const temp = clima.current_weather.temperature;
    document.getElementById("resultado").textContent = "Temperatura en " + ciudad + ": " + temp + "°C";
  });
           });
        }
    </script>
</body>
</html>
