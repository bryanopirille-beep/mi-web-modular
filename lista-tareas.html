<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi lista de tareas</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; text-align: center; padding-top: 50px; }
    h1 { color: #1a73e8; }
    input { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; width: 250px; }
    button { background-color: #1a73e8; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-left: 10px; }
    ul { list-style: none; padding: 0; max-width: 320px; margin: 30px auto; text-align: left; }
    li { background-color: white; padding: 10px 15px; margin-bottom: 8px; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>Mi lista de tareas</h1>
  <input type="text" id="inputTarea" placeholder="Escribe una tarea...">
  <button onclick="agregarTarea()">Agregar</button>
  <ul id="lista"></ul>

  <script>
    let tareas = [];
    function crearTareaEnPantalla(texto){
      const li = document.createElement("li");
      li.textContent= texto;

      const btnEliminar= document.createElement("button");
      btnEliminar.textContent = "Eliminar";
      btnEliminar.onclick = function () {
        li.remove();
      };
      li.appendChild(btnEliminar);
      document.getElementById("lista").appendChild(li);
    }
   function agregarTarea() {
  const input = document.getElementById("inputTarea");
  if (input.value === "") {
    alert("Escribí algo primero");
    return;
  }
  tareas.push(input.value);
  localStorage.setItem("misTareas", JSON.stringify(tareas));
  crearTareaEnPantalla(input.value);
  input.value = "";
}
const guardadas= localStorage.getItem("misTareas");
if (guardadas !== null){
  tareas = JSON.parse(guardadas);
  tareas.forEach(function(texto) {
    crearTareaEnPantalla(texto);
  });
}
</script>
</body>
</html>
