<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi lista de tareas</title>
    <style>
        /* 1. Cambiamos el fondo de la página a oscuro y ponemos el texto blanco */
        body {
    background-color: #181a1f !important;
    color: #ffffff !important;
    font-family: sans-serif;
    text-align: center;
    padding: 40px;
}

h1 {
    color: #ffffff !important;
}

#inputTarea {
    background-color: #21252b !important;
    color: #ffffff !important;
    border: 1px solid #3e4451 !important;
    padding: 10px;
    border-radius: 6px;
    outline: none;
}

/* Botón Agregar (Azul profesional) */
.btn-agregar {
    background-color: #61afef !important;
    color: #181a1f !important;
    border: none !important;
    padding: 10px 16px !important;
    border-radius: 6px !important;
    font-weight: bold !important;
    cursor: pointer !important;
}

#lista {
    list-style: none;
    padding: 0;
    max-width: 450px;
    margin: 20px auto;
    text-align: left;
}

#lista li {
    background-color: #21252b !important;
    color: #abb2bf !important;
    border: 1px solid #3e4451 !important;
    padding: 10px 14px !important;
    margin-bottom: 8px !important;
    border-radius: 6px !important;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

/* Botones Eliminar de cada tarea (Rojo sutil) */
#lista li button {
    background-color: #e06c75 !important;
    color: #ffffff !important;
    border: none !important;
    padding: 6px 12px !important;
    border-radius: 4px !important;
    font-weight: 600 !important;
    cursor: pointer !important;
}

/* Botón Borrar completadas (Gris pizarra) */
.btn-borrar-completadas {
    background-color: #3e4451 !important;
    color: #ffffff !important;
    border: none !important;
    padding: 10px 16px !important;
    border-radius: 6px !important;
    font-weight: 600 !important;
    cursor: pointer !important;
}
    </style>
</head>
<body>
  <h1>Mi lista de tareas</h1>
  <!-- Input y botón agregar -->
<input type="text" id="inputTarea" placeholder="Escribe una tarea...">
<button onclick="agregarTarea()" class="btn-agregar">Agregar</button>

<ul id="lista"></ul>

<!-- Botón borrar -->
<button onclick="borrarCompletadas()" class="btn-borrar-completadas">Borrar completadas</button>
  <script>
    let tareas = [];

    function crearTareaEnPantalla(tarea){
      const li = document.createElement("li");
      
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = tarea.completada;
      checkbox.onclick = function () {
        tarea.completada = checkbox.checked;
        localStorage.setItem("misTareas", JSON.stringify(tareas));
      };

      const span = document.createElement("span");
      span.textContent = tarea.texto;

      const btnEliminar = document.createElement("button");
      btnEliminar.textContent = "Eliminar";
      btnEliminar.onclick = function (){
        li.remove();
        // Opcional avanzado: actualizar array y localStorage al eliminar individualmente
      };

      // Orden visual correcto: Checkbox -> Texto -> Botón Eliminar
      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(btnEliminar);

      document.getElementById("lista").appendChild(li);
    }

    function agregarTarea() {
      const input = document.getElementById("inputTarea");
      if (input.value === "") {
        alert("¡Ey, poné una tarea primero!");
        return;
      }
      const nuevaTarea = { texto: input.value, completada: false };
      tareas.push(nuevaTarea);
      localStorage.setItem("misTareas", JSON.stringify(tareas));
      crearTareaEnPantalla(nuevaTarea);
      input.value = "";
    }

    const guardadas = localStorage.getItem("misTareas");
    if (guardadas !== null) {
      tareas = JSON.parse(guardadas);
      tareas.forEach(function (tarea) {
        crearTareaEnPantalla(tarea);
      });
    }

    function borrarCompletadas() {
      tareas = tareas.filter(function (tarea) {
        return tarea.completada === false;
      });
      
      localStorage.setItem("misTareas", JSON.stringify(tareas));
      document.getElementById("lista").innerHTML = "";
      tareas.forEach(function (tarea) {
        crearTareaEnPantalla(tarea);
      });
    }
  </script>
</body>
</html>
